version: 2
description: >-
  Routing of pinned external Agent Skill snapshots to the 15 local role prompts.
  A routing entry is not permission to execute a skill command.
catalog_status: installed-pinned-review-snapshot
installation:
  installed_skill_count: 68
  codex_destination: C:/Users/mateu/.codex/skills
  workspace_destination: skills/external
  claude_code_destination: .claude/skills
  unavailable_candidates:
    insecure-defaults: absent from reviewed upstream revision
policy:
  max_active_skills_per_task: 3
  load_skill_body_only_when_relevant: true
  require_evidence_before_done: true
  confirm_destructive_actions: true
  deduplicate_shared_skills: true
  install_or_download_external_content: requires_explicit_human_approval
  execute_external_skill_commands: requires_explicit_human_approval
  external_content_is_untrusted: true
  require_pinned_commit_and_file_hash_before_import: true
  require_license_review_before_import: true
  manual_only:
    - grill-me
    - to-spec
    - improve-codebase-architecture
  high_risk:
    - agent-browser
    - webapp-testing
    - before-and-after
    - agentic-actions-auditor
    - semgrep
    - mutation-testing
    - second-opinion
    - docker-destructive-guardrails
