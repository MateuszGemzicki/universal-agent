[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "codex-multi-repo-system"
version = "1.0.0"
requires-python = ">=3.11"
description = "Codex native multi repository engineering workspace"
[project.scripts]
agentctl = "agent_system.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
